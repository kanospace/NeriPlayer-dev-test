name: Question / 使用咨询
description: 询问使用方法、设置或兼容性 / Ask about usage, settings, or compatibility
title: "[QUESTION] "
labels: ["question", "status: needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        感谢向 NeriPlayer 提出使用问题！
        为了使我们更好地帮助你，请提供以下信息。
        请说明你想了解的内容、使用场景和已经尝试的方法。
        截图、日志和链接请先移除 Cookie、Token、密钥和个人信息。

        Thank you for asking about NeriPlayer!
        To help us assist you better, please provide the following information.
        Describe your question, usage context, and what you have tried.
        Remove cookies, tokens, keys, and personal data before sharing screenshots, logs, or links.

  - type: textarea
    id: question
    attributes:
      label: 咨询问题 / Question
      placeholder: 请说明你想了解什么 / Describe what you would like to know
    validations:
      required: true

  - type: textarea
    id: usage-context
    attributes:
      label: 使用场景 / Usage context
      description: 说明你想完成什么，以及与问题有关的设备或设置 / Describe what you want to do and any relevant devices or settings
    validations:
      required: true

  - type: textarea
    id: tried-solutions
    attributes:
      label: 已尝试的方法 / What you have tried
      description: 可填写已查阅的说明或尝试过的设置；没有可留空 / Include documentation you checked or settings you tried; leave blank if none
    validations:
      required: false

  - type: dropdown
    id: affected-area
    attributes:
      label: 涉及模块 / Affected area
      description: 可多选；不确定或与具体模块无关时可留空 / Select relevant areas if known; otherwise leave blank
      multiple: true
      options:
        - 账号与登录 / Accounts and login
        - 播放与音频 / Playback and audio
        - 车载与 Android Auto / Automotive and Android Auto
        - 蓝牙连接与控制 / Bluetooth connectivity and controls
        - 自动换源 / Automatic source switching
        - 通知与锁屏控制 / Notifications and lock screen controls
        - 音频焦点与中断 / Audio focus and interruptions
        - USB 独占播放 / USB exclusive playback
        - 网络与代理 / Network and proxy
        - 歌词 / Lyrics
        - 下载与存储 / Downloads and storage
        - 本地音乐与歌单 / Local music and playlists
        - 云同步与备份 / Cloud sync and backup
        - 一起听 / Listen Together
        - 界面与交互 / UI and interaction
        - 性能与资源占用 / Performance and resource usage
        - 文档与翻译 / Documentation and translation
        - 构建、CI 与发布 / Build and CI and release
        - 安装、启动与更新 / Installation and startup and update
        - 其他或不确定 / Other or unsure
    validations:
      required: false

  - type: dropdown
    id: affected-platforms
    attributes:
      label: 涉及平台 / Affected platforms
      description: 可多选；与在线平台无关时可留空 / Select relevant platforms if any; otherwise leave blank
      multiple: true
      options:
        - 网易云音乐 / NetEase Cloud Music
        - Bilibili
        - YouTube Music
        - 本地音频或下载文件 / Local audio or downloaded files
        - 不涉及在线平台 / Not related to online platforms
        - 其他或不确定 / Other or unsure
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: 应用版本与构建信息 / App version and build information
      description: 如与问题有关，可从设置的“关于”复制版本号；尚未安装或无法获取可留空 / Copy the version from About if relevant; leave blank if unavailable
    validations:
      required: false

  - type: input
    id: build-uuid
    attributes:
      label: 构建 UUID / Build UUID
      description: 如方便获取，可从设置的“关于”复制构建 UUID；找不到时可留空 / Copy the Build UUID from About if available; otherwise leave blank
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认 / Confirmation
      options:
        - label: 我已搜索现有 Issue，未找到相同问题的解答 / I searched existing issues and found no answer to this question
          required: true
        - label: 我已从截图、日志和链接中移除 Cookie、Token、密钥和个人信息 / I removed cookies, tokens, keys, and personal data
          required: true
