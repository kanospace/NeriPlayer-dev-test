name: Suggestion Submission / 提交建议
description: 提交对 NeriPlayer 的优化建议，助力产品体验提升 / Submit optimization suggestions for NeriPlayer to enhance user experience
title: "[Suggestion] "
labels: ["enhancement", "status: needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        此模板用于改进现有功能、交互或性能；全新能力请使用“功能请求”模板。
        请说明当前痛点和改进后的收益，附件中请移除账号和密钥等隐私信息。

        Use this form to improve existing behavior, UX, or performance.
        Describe the pain point and concrete benefit, and redact private data from attachments.

  - type: textarea
    id: suggestion-overview
    attributes:
      label: 建议概述 / Suggestion overview
      placeholder: |
        用简洁的语言描述您的建议（例如：建议支持 B 站播放源的视频播放功能）
        
        Describe your suggestion concisely (e.g.: Suggest supporting video playback for Bilibili sources)
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 建议的背景与原因 / Background & Reason for Suggestion
      placeholder: |
        说明您提出此建议的场景或痛点（例如：部分 B 站鬼畜视频的核心价值在于视觉呈现，仅播放音频无法完整体验内容）
        
        Explain the scenario or pain point that leads to this suggestion (e.g.: The core value of some Bilibili meme videos lies in visual presentation, and audio-only playback fails to deliver the complete experience)
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: 建议的具体实施方案 / Detailed Implementation Plan (Optional)
      placeholder: |
        （可选）描述您期望的实现方式（例如：在「正在播放」界面向上滑动封面，让封面变形为视频播放窗口）
        
        (Optional) Describe your expected implementation method (e.g.: Swipe up on the cover in the "Now Playing" interface to bring up the video playback window)
    validations:
      required: false

  - type: textarea
    id: expected-result
    attributes:
      label: 预期效果 / Expected Effect
      placeholder: |
        说明建议实施后能带来的改善（例如：满足用户对视频内容的观看需求，提升B站资源的使用体验）
        
        Explain the improvements after implementation (e.g.: Meet users' needs for viewing video content and enhance the experience of using Bilibili resources)
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: 涉及模块 / Affected area
      description: 可多选；请选择希望改进的模块 / Select the areas you would like to improve
      multiple: true
      options:
        - 账号与登录 / Accounts and login
        - 播放与音频 / Playback and audio
        - USB 独占播放 / USB exclusive playback
        - 网络与代理 / Network and proxy
        - 歌词 / Lyrics
        - 下载与存储 / Downloads and storage
        - 本地音乐与歌单 / Local music and playlists
        - 云同步与备份 / Cloud sync and backup
        - 一起听 / Listen Together
        - 界面与交互 / UI and interaction
        - 性能与资源占用 / Performance and resource usage
        - 文档与翻译 / Documentation and translation
        - 构建、CI 与发布 / Build and CI and release
        - 安装、启动与更新 / Installation and startup and update
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: dropdown
    id: affected-platforms
    attributes:
      label: 涉及平台 / Affected platforms
      description: 可多选；不依赖在线平台时选择“不涉及在线平台” / Select all affected platforms or choose not related
      multiple: true
      options:
        - 网易云音乐 / NetEase Cloud Music
        - Bilibili
        - YouTube Music
        - 本地音频或下载文件 / Local audio or downloaded files
        - 不涉及在线平台 / Not related to online platforms
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本与构建信息 / App version and build information
      description: 从设置的“关于”复制版本号；无法确认可填“未知” / Copy the version from About or enter unknown
      placeholder: 例如 c362c9a.10251232，或未知
    validations:
      required: true

  - type: input
    id: build-uuid
    attributes:
      label: 构建 UUID / Build UUID
      description: 从设置的“关于”复制构建 UUID；找不到可填“未知” / Copy the Build UUID from About or enter unknown
      placeholder: 构建 UUID，或未知
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: 安装来源 / Distribution
      options:
        - GitHub Release
        - GitHub Actions CI
        - Telegram CI 频道 / Telegram CI channel
        - 本地源码构建 / Local source build
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: textarea
    id: related-features
    attributes:
      label: 关联的现有功能（可选） / Associated Existing Features (Optional)
      placeholder: |
        （可选）若建议与现有功能相关，请列出（例如：与「正在播放界面」功能相关）
        
        (Optional) If related to existing features, please list them (e.g.: Related to "Playback Source Management" and "Now Playing Interface" features)
    validations:
      required: false

  - type: textarea
    id: additional-materials
    attributes:
      label: 补充材料（可选） / Supplementary Materials (Optional)
      placeholder: |
        （可选）可粘贴参考案例截图、设计草图链接或其他辅助说明材料
        
        (Optional) You can paste links to reference screenshots, design sketches, or other supplementary materials
    validations:
      required: false

  - type: checkboxes
    id: duplication-check
    attributes:
      label: 提交前确认 / Confirmation Before Submission
      options:
        - label: 我已搜索现有 Issue，未找到相同或高度相似的建议 / I searched existing issues and found no duplicate suggestion
          required: true
        - label: 我已说明当前痛点和预期改善 / I described the current pain point and expected improvement
          required: true
